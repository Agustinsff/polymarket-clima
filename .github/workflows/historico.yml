name: historico
on:
  push:
    branches: [backtest-historico]   # en main se corre a mano (workflow_dispatch)
    paths: [historico/*.py, .github/workflows/historico.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python historico/backtest.py 2>&1 | tee historico/log.txt || true
        env:
          LIMITE_MIN: "3"
      - run: |
          git config user.name "polymarket-clima-bot"
          git config user.email "actions@users.noreply.github.com"
          git add historico/ && git commit -m "historico: resultados" && git pull --rebase && git push
