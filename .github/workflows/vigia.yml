name: vigia
on:
  schedule:
    - cron: "23 * * * *"   # cada hora
  workflow_run:            # y apenas termina cada corrida de las cadenas
    workflows: [reloj, cosechador]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: vigia
  cancel-in-progress: false
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Montevideo
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre los datos mas nuevos
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar y avisar si algo dejo de andar
        run: python vigia.py
