name: maker_quietos
# Bot de PAPEL de mercados quietos con recompensa, fuera de clima (bot/quietos.py, reglas en bot/quietos/REGLA.md).
# No opera ni tiene billetera: solo lee la API publica. Encadenado como maker_bot.yml: ~5 h por corrida, sube los
# archivos de bot/quietos/ cada ~55 min. Se apaga solo con "apagar_despues_de" de bot/quietos/config.json o si existe
# bot/quietos/PARAR. No toca los archivos del maker real ni los del papel de clima.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"   # respaldo si la cadena se corta
permissions:
  contents: write
  actions: write
concurrency:
  group: maker_quietos
  cancel-in-progress: false
jobs:
  papel:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot/test_quietos.py
      - name: Configurar git
        run: |
          git config user.name "polymarket-clima-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Bot quietos en papel (6 tramos de 55 min, sube los archivos al final de cada uno)
        run: |
          for i in 1 2 3 4 5 6; do
            [ -f bot/quietos/PARAR ] && break
            [ -f bot/quietos/PARAR_maker_papel ] && break
            timeout -s INT 3300 python bot/quietos.py bucle || true
            git add bot/quietos/maker_ops_papel.csv bot/quietos/maker_estado_papel.json bot/quietos/maker_resumen_papel.md \
                    bot/quietos/censo_quietos.csv bot/quietos/fotos_dia.json bot/quietos/PARAR_maker_papel 2>/dev/null
            git commit -qm "datos: bot quietos en papel $(date -u +%Y-%m-%dT%H:%MZ)" || true
            for j in 1 2 3 4 5; do
              git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && break
              sleep $((RANDOM % 20 + 5))
            done
          done
      - name: Encadenar la proxima corrida
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f bot/quietos/PARAR ] && exit 0
          [ -f bot/quietos/PARAR_maker_papel ] && exit 0
          if [ "$(date -u +%Y-%m-%d\ %H:%M)" \> "$(python -c "import json;print(json.load(open('bot/quietos/config.json'))['maker']['apagar_despues_de'])")" ]; then exit 0; fi
          gh workflow run maker_quietos.yml --ref main -R ${{ github.repository }}
