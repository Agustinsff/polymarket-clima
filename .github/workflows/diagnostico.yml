name: diagnostico
on:
  push:
    branches: [diagnostico-gamma]
    paths: [diag/gamma.py, .github/workflows/diagnostico.yml]
permissions:
  contents: write
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python diag/gamma.py 2> diag/error.txt || true
      - run: |
          git config user.name "polymarket-clima-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diag/por_ciudad.json diag/error.txt && git commit -m "diag: resultados" && git push
