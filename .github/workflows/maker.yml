name: maker
# Investigacion maker/: mide si dejar ordenes como maker paga (ver maker/REGLA.md). No opera.
on:
  push:
    branches: [medidor-maker]
    paths: [maker/medir.py, maker/minutos.txt, .github/workflows/maker.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: maker
  cancel-in-progress: false
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: medidor-maker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p maker/datos && python maker/medir.py "$(cat maker/minutos.txt)" 2>&1 | tee -a maker/datos/registro.txt || true
      - run: |
          git config user.name "polymarket-clima-bot"
          git config user.email "actions@users.noreply.github.com"
          git add maker/datos/ && git commit -m "maker: fotos $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin medidor-maker && git push origin HEAD:medidor-maker && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
      - name: Encadenar la proxima corrida (hasta el 9-nov)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%Y%m%d)" -le 20261109 ] || exit 0
          gh workflow run maker.yml --ref medidor-maker -R ${{ github.repository }}
