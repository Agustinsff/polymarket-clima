name: rivales
on:
  push:
    branches: [investigacion-rivales]
    paths: [rivales/bajar.py, .github/workflows/rivales.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python rivales/bajar.py 2 1 2>&1 | tee rivales/log.txt || true
      - run: |
          git config user.name "polymarket-clima-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rivales/ && git commit -m "rivales: datos bajados" && git push
