name: markout
# Medicion de llenados del bot maker en real (markout/REGLA.md): baja los llenados de la billetera (data-api) y la
# historia de precios (CLOB), calcula a 5/30/60/180 min y a la resolucion, y guarda markout/datos/llenados.csv +
# markout/informe.md en main. Billetera: la del bot, escrita en markout/markout.py (MAKER_WALLET la pisa si existe).
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
concurrency:
  group: markout
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: medir
        env:
          MAKER_WALLET: ${{ vars.MAKER_WALLET }}
        run: python markout/markout.py
      - name: guardar
        run: |
          git config user.name "polymarket-clima-bot"
          git config user.email "actions@users.noreply.github.com"
          git add markout/datos markout/informe.md
          git commit -m "markout: llenados $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((2**i)); done
