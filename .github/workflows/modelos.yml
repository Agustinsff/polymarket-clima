name: modelos
on:
  push:
    branches: [modelos-pronostico]   # en main se corre a mano (workflow_dispatch)
    paths: [modelos/*.py, .github/workflows/modelos.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          if [ -f modelos/comparar.py ]; then python modelos/comparar.py 2> modelos/log.txt || true; fi
      - run: |
          git config user.name "polymarket-clima-bot"
          git config user.email "actions@users.noreply.github.com"
          git add modelos/ && git commit -m "modelos: resultados" && git push
