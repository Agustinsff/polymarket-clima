name: carrera
on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 a 13:50 Montevideo
    - cron: "0 17 * * *"   # 14:00 a 19:50 Montevideo
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: carrera
  cancel-in-progress: false
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: America/Montevideo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ejecutar
        run: |
          python carrera.py 350 || true
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "polymarket-clima-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in carrera.csv; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "datos: carrera de fuentes $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
